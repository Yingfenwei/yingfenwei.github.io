name: Publish homepage

on:
  push:
    paths:
      - 'dist/**'
      - 'scripts/check-content.mjs'
      - 'scripts/build-pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check homepage content
        run: |
          node --check dist/home.js
          node scripts/check-content.mjs
      - name: Prepare versioned website
        run: python scripts/build-pages.py _site "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
